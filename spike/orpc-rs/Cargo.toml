[package]
name = "orpc-spike"
version = "0.0.0"
edition = "2024"

[dependencies]
orpc = "1.1"
orpc-axum = "1.1"
orpc-specta = "1.1"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
axum = "0.8"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
