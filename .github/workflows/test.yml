name: Test and build
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Boot against a local db and hit the API
        run: |
          PORT=8080 SITE_URL=http://localhost:8080 bun server/index.ts &
          sleep 3
          curl -sSf http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -sSf http://localhost:8080/api/auth/status; echo
          curl -sSf -o /dev/null -w 'manifest -> %{http_code} %{content_type}\n' http://localhost:8080/manifest.webmanifest
          # members only: the timeline, feeds and previews answer 401 without a session or feed token
          [ "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/api/posts)" = 401 ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/feed.xml)" = 401 ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:8080/feed.json?token=nope")" = 401 ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"text":"x"}' http://localhost:8080/api/posts)" = 401 ]
          # a shared post URL unfurls to the generic card only
          curl -sSf http://localhost:8080/p/abc123 | grep -q 'og:title" content="Murmur"'
          curl -sSf http://localhost:8080/p/abc123 | grep -q 'A murmur was shared with you'
          curl -sSf -o /dev/null -w 'og.jpg -> %{http_code} %{content_type} %{size_download}B\n' http://localhost:8080/og.jpg
          curl -sSf "http://localhost:8080/api/auth/username/johan"; echo
      - name: Passkey flows in a browser (sign-up, device link, feed token)
        run: bunx playwright install --with-deps chromium && bun test/e2e.ts
